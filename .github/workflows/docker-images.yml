# Builds the production images natively on arm64 (the server's arch) and pushes them to Docker Hub.
# Secrets (GitHub environment `ai-customer-support-saas`): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Read & Write), DOCKERHUB_REPO, NEXT_PUBLIC_API_URL (https://api.example.com).
name: docker-images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    environment: ai-customer-support-saas         # holds the DOCKERHUB_* and NEXT_PUBLIC_API_URL secrets
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          # :<name> is what the server pulls; :<name>-<sha> is kept for rollback
          tags: |
            ${{ env.IMAGE }}:${{ matrix.name }}
            ${{ env.IMAGE }}:${{ matrix.name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
