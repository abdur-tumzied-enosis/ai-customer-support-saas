# Builds the production images natively on arm64 (the server's arch) and pushes them to Docker Hub.
# Repo settings needed: secret DOCKERHUB_TOKEN (Read & Write), variable NEXT_PUBLIC_API_URL (https://api.example.com).
name: docker-images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: tz01x
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          # :<name> is what the server pulls; :<name>-<sha> is kept for rollback
          tags: |
            tz01x/auto-magic-pro:${{ matrix.name }}
            tz01x/auto-magic-pro:${{ matrix.name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
