# Production stack for Coolify (2 vCPU / 12 GB). Differs from docker-compose.yml (dev):
# - no published ports: only django and web are public, through Coolify's proxy (set their domains in the UI:
#   django -> https://api.example.com:8000, web -> https://app.example.com:3000)
# - no source bind mounts: containers run the code baked into the image
# - uploads live in the private R2 bucket `main` (docs/r2-storage.md); Qdrant requires an API key
# - small worker pools sized for 2 vCPU
# Variables marked :? are required; Coolify lists them in the resource's Environment Variables tab.

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: core.settings
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}                 # api.example.com
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}   # https://app.example.com
  CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN:?}       # .example.com
  ADMIN_URL: ${ADMIN_URL:?}                         # some-unguessable-path/
  NUM_PROXIES: "1"
  SITE_URL: ${SITE_URL:?}                           # https://app.example.com
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}             # https://api.example.com
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}           # token scoped to the `main` bucket only
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
  R2_BUCKET: ${R2_BUCKET:-main}
  POSTGRES_DB: ${POSTGRES_DB:-auto_magic_pro}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?}
  EMBEDDINGS_URL: http://embeddings
  RERANKER_URL: http://reranker
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:?}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}         # needed once a ModelConfig role points at an OpenRouter model
  GOOGLE_USE_VERTEXAI: ${GOOGLE_USE_VERTEXAI:-true}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
  LLM_PROVIDER: ${LLM_PROVIDER:-google}
  META_APP_ID: ${META_APP_ID:?}
  META_APP_SECRET: ${META_APP_SECRET:?}
  FB_VERIFY_TOKEN: ${FB_VERIFY_TOKEN:?}
  IMAGE_SEARCH_ENABLED: ${IMAGE_SEARCH_ENABLED:-false}
  # ponytail: only the vars production needs; settings.py defaults cover the rest. To override one
  # (GOOGLE_CLOUD_PROJECT, LLM_MODEL, LLM_THINKING_LEVEL, ...), add a `NAME: ${NAME}` line here.

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment: *backend-env

services:
  django:
    <<: *backend
    # 2 workers x 8 threads for 2 vCPU; migrations run on every deploy before serving
    command: sh -c "python manage.py migrate --noinput && exec gunicorn -k gthread -w 2 --threads 8 --timeout 60 -b 0.0.0.0:8000 --log-level info core.wsgi:application"
    depends_on: [postgres, redis, qdrant, embeddings, reranker]

  celery:
    <<: *backend
    command: celery -A core worker -l info --concurrency=2
    environment:
      <<: *backend-env
      C_FORCE_ROOT: "true"
    depends_on: [django]

  celery-replies:
    <<: *backend
    # ~200 MB per process; +~650 MB each with IMAGE_SEARCH_ENABLED, so keep this low on 12 GB
    command: celery -A core worker -Q replies -l info --concurrency=${REPLY_WORKER_CONCURRENCY:-4}
    environment:
      <<: *backend-env
      C_FORCE_ROOT: "true"
    depends_on: [django]

  celery-beat:
    <<: *backend
    command: celery -A core beat -l info -s /tmp/celerybeat-schedule
    volumes: []
    depends_on: [django]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}   # https://api.example.com
    restart: unless-stopped
    depends_on: [django]

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id intfloat/multilingual-e5-base
    restart: unless-stopped
    volumes:
      - tei_models:/data

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    restart: unless-stopped
    volumes:
      - tei_models:/data

  redis:
    image: redis:7
    restart: unless-stopped

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_magic_pro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage:
  tei_models:
