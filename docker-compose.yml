version: "3.9"

services:
  django:
    container_name: auto-magic-pro-be
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
    depends_on:
      - postgres
      - redis
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      C_FORCE_ROOT: "true"
    depends_on:
      - redis
      - django
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
    depends_on:
      - redis
      - django
    command: celery -A core beat -l info
    volumes:
      - ./backend:/app

    # web:
    #   build:
    #     context: .
    #     dockerfile: frontend/Dockerfile
    #   ports:
    #     - "3000:3000"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_magic_pro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.9.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # n8n (optional): enable by uncommenting below
  # n8n:
  #   image: n8nio/n8n:1.66.1
  #   ports:
  #     - "5678:5678"
  #   environment:
  #     - N8N_SECURE_COOKIE=false
  #   volumes:
  #     - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  qdrant_storage:
  # n8n_data:


