version: "3.9"

services:
  django:
    container_name: auto-magic-pro-be
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      DJANGO_SETTINGS_MODULE: core.settings
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDINGS_URL: http://embeddings
      RERANKER_URL: http://reranker
    depends_on:
      - postgres
      - redis
      - qdrant
      - embeddings
      - reranker
      # - ollama
    ports:
      - "8251:8000"
    volumes:
      - ./backend:/app
      - ./gcp-sa.json:/secrets/gcp-sa.json:ro

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      DJANGO_SETTINGS_MODULE: core.settings
      C_FORCE_ROOT: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDINGS_URL: http://embeddings
      RERANKER_URL: http://reranker
    depends_on:
      - redis
      - django
      - embeddings
      - reranker
      # - ollama
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
      - ./gcp-sa.json:/secrets/gcp-sa.json:ro

  celery-replies:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      DJANGO_SETTINGS_MODULE: core.settings
      C_FORCE_ROOT: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDINGS_URL: http://embeddings
      RERANKER_URL: http://reranker
    depends_on:
      - redis
      - django
      - embeddings
      - reranker
    # Only customer replies (CELERY_TASK_ROUTES). The models live in the embeddings/reranker services and a reply
    # mostly waits on the LLM, so processes are small: concurrency = parallel replies, bounded by RAM and LLM quota.
    # Except with IMAGE_SEARCH_ENABLED: each process that answers a photo loads CLIP in-process (~650 MB), so budget
    # ~650 MB x REPLY_WORKER_CONCURRENCY, or lower the concurrency or add --max-memory-per-child.
    command: celery -A core worker -Q replies -l info --concurrency=${REPLY_WORKER_CONCURRENCY:-16}
    volumes:
      - ./backend:/app
      - ./gcp-sa.json:/secrets/gcp-sa.json:ro

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
    depends_on:
      - redis
      - django
    command: celery -A core beat -l info
    volumes:
      - ./backend:/app

    # web:
    #   build:
    #     context: .
    #     dockerfile: frontend/Dockerfile
    #   ports:
    #     - "3000:3000"

  # Model servers for agents/vector_store.py (EMBEDDINGS_URL / RERANKER_URL), loaded once here instead of in every
  # worker process. Changing the embedding model means changing --model-id here and re-indexing.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id intfloat/multilingual-e5-base
    volumes:
      - tei_models:/data

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    volumes:
      - tei_models:/data

  redis:
    image: redis:7
    ports:
      - "6378:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_magic_pro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

